name: Deploy to GitHub Pages

on:
  push:
    branches:
      - deploy # Change to 'main' if your default branch is main

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: 
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (with retries)
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
        run: |
          for i in 1 2 3 4 5; do
            npm ci --no-audit --no-fund && break
            echo "npm ci failed, retry #$i"
            sleep $((i * 10))
          done

      - name: Upload npm debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: /home/runner/.npm/_logs/*.log
      - name: Build
        run: |
          npm ci
          npm run build    # produce ./build (or change path below)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist    # point to your build output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5